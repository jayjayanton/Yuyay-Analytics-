name: Export Yuyay logo assets
on:
  push:
    branches: [main]
    paths:
      - "images/yuyay-logo-approved.svg"
      - ".github/workflows/export-yuyay-logo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install logo renderer
        run: python -m pip install "CairoSVG==2.7.1" "Pillow==11.3.0"
      - name: Render approved logo for LinkedIn and presentations
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image
          root = Path("images")
          source = root / "yuyay-logo-approved.svg"
          full = Image.open(io.BytesIO(cairosvg.svg2png(url=str(source), output_width=1600))).convert("RGBA")
          def on_white(image):
              c = Image.new("RGB", image.size, "white")
              c.paste(image, (0, 0), image)
              return c
          presentation = on_white(full)
          presentation.save(root / "Yuyay_Analytics_Presentation_Logo.png", optimize=True)
          preview = Image.new("RGB", (1200, 630), "white")
          artwork = presentation.copy()
          artwork.thumbnail((1100, 550), Image.Resampling.LANCZOS)
          preview.paste(artwork, ((1200-artwork.width)//2, (630-artwork.height)//2))
          preview.save(root / "yuyay-linkedin-preview.png", optimize=True)
          source_square = Image.open(io.BytesIO(cairosvg.svg2png(url=str(source), output_width=1200))).convert("RGBA")
          symbol = source_square.crop((0, 0, 465, source_square.height))
          symbol.thumbnail((660, 660), Image.Resampling.LANCZOS)
          square = Image.new("RGB", (800, 800), "white")
          square.paste(symbol, ((800-symbol.width)//2, (800-symbol.height)//2), symbol)
          square.save(root / "Yuyay_Analytics_LinkedIn_Icon.png", optimize=True)
          assert preview.size == (1200,630) and square.size == (800,800)
          print("Rendered approved Yuyay logo PNGs and LinkedIn preview")
          PY
      - name: Commit refreshed media assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/Yuyay_Analytics_Presentation_Logo.png images/Yuyay_Analytics_LinkedIn_Icon.png images/yuyay-linkedin-preview.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish approved Yuyay logo for LinkedIn previews"
            git push origin HEAD:main
          fi
