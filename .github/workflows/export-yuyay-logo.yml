name: Export Yuyay logo assets
on:
  push:
    branches: [main]
    paths:
      - "images/yuyay-ecuador-logo.svg"
      - "images/yuyay-ecuador-mark.svg"
      - ".github/workflows/export-yuyay-logo.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install logo renderer
        run: python -m pip install "CairoSVG==2.7.1" "Pillow==11.3.0"
      - name: Render presentation and social identity images
        run: |
          python - <<'PY'
          import io
          from pathlib import Path
          import cairosvg
          from PIL import Image
          root = Path("images")
          full = Image.open(io.BytesIO(cairosvg.svg2png(url=str(root/"yuyay-ecuador-logo.svg"), output_width=1600))).convert("RGBA")
          canvas = Image.new("RGB", full.size, "#FFFFFF")
          canvas.paste(full, (0, 0), full)
          canvas.save(root/"Yuyay_Analytics_Presentation_Logo.png", optimize=True)
          mark = Image.open(io.BytesIO(cairosvg.svg2png(url=str(root/"yuyay-ecuador-mark.svg"), output_width=650))).convert("RGBA")
          avatar = Image.new("RGB", (800, 800), "#FFFFFF")
          avatar.paste(mark, ((800-mark.width)//2, (800-mark.height)//2), mark)
          avatar.save(root/"Yuyay_Analytics_LinkedIn_Icon.png", optimize=True)
          assert Image.open(root/"Yuyay_Analytics_Presentation_Logo.png").width == 1600
          assert Image.open(root/"Yuyay_Analytics_LinkedIn_Icon.png").size == (800,800)
          print("Created brand assets:", (root/"Yuyay_Analytics_Presentation_Logo.png").stat().st_size, (root/"Yuyay_Analytics_LinkedIn_Icon.png").stat().st_size)
          PY
      - name: Publish image assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/Yuyay_Analytics_Presentation_Logo.png images/Yuyay_Analytics_LinkedIn_Icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Publish new Yuyay logo PNGs for LinkedIn and presentations"
            git push origin HEAD:main
          fi
